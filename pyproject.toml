[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uitk"
dynamic = ["version", "readme"]
description = "A comprehensive UI toolkit extending Qt Designer workflows with dynamic loading, custom widgets, and automatic signal-slot management."
authors = [{name = "Ryan Simpson", email = "m3trik@outlook.com"}]
license = {text = "LGPL-3.0-or-later"}
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: OS Independent",
]

# Dependencies - Qt BINDINGS (PySide2/6, shiboken) are deliberately excluded:
# the host DCC provides its own. qtpy is NOT a binding — it's a pure-Python
# shim with no binding dependency, imported unconditionally, so it must ship
# (a clean `pip install` into stock mayapy has no qtpy and fails at import).
dependencies = [
    "pythontk>=0.9.7",
    "qtpy>=2.0",  # PySide6 support landed in 2.0
]

[project.urls]
Homepage = "https://github.com/m3trik/uitk"
Repository = "https://github.com/m3trik/uitk"

[tool.setuptools.dynamic]
version = {attr = "uitk.__version__"}
readme = {file = "docs/README.md", content-type = "text/markdown"}

[tool.setuptools.packages.find]
where = ["."]
include = ["uitk*"]

[tool.setuptools.package-data]
"*" = ["*.ui", "*.json", "*.txt", "*.md"]
