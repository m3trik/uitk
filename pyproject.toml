[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uitk"
dynamic = ["version", "readme"]
description = "A comprehensive UI toolkit extending Qt Designer workflows with dynamic loading, custom widgets, and automatic signal-slot management."
authors = [{name = "Ryan Simpson", email = "m3trik@outlook.com"}]
license = {text = "LGPL-3.0-or-later"}
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: OS Independent",
]

# Dependencies - Qt BINDINGS (PySide2/6, shiboken) are deliberately excluded:
# the host DCC provides its own. qtpy is NOT a binding — it's a pure-Python
# shim with no binding dependency, imported unconditionally, so it must ship
# (a clean `pip install` into stock mayapy has no qtpy and fails at import).
dependencies = [
    # 0.9.25 is the floor for ptk.StatusBadge's module-coverage badge gate
    # (discover_module_names / module_of / is_import_standin / gate) that
    # test/run_tests.py stamps through -- 0.9.24 ships the class without them.
    "pythontk>=0.9.36",
    "qtpy>=2.0",  # PySide6 support landed in 2.0
]

[project.urls]
Homepage = "https://github.com/m3trik/uitk"
Repository = "https://github.com/m3trik/uitk"

[tool.setuptools.dynamic]
version = {attr = "uitk.__version__"}
readme = {file = "docs/README.md", content-type = "text/markdown"}

[tool.setuptools.packages.find]
where = ["."]
include = ["uitk*"]

[tool.setuptools.package-data]
"*" = ["*.ui", "*.json", "*.txt", "*.md"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = [".", "test"]
addopts = "--ignore=test/temp_tests"

[tool.ruff]
# House formatter/linter - rule set, exemptions and gate status: m3trik/docs/CODE_STANDARD.md section 1.
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]  # house pattern: try-guarded DCC imports precede the other imports

[tool.ruff.lint.per-file-ignores]
"**/templates/**" = ["F821"]  # exec-templates carry __PLACEHOLDER__ tokens substituted at run time
