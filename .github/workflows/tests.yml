name: Tests

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    # Backstop: a hung test step used to run to GitHub's 6h job cap with no
    # output (see the streamed tee + per-test --timeout below). Cap the job so a
    # hang fails in minutes, not hours.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1 python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin PySide6 to <6.11: 6.11 segfaults during pytest cleanup
          # AND mid-test on offscreen QPA (test_chip_set_drops_orphaned_tag
          # in test_switchboard_browser.py crashes inside menu.py eventFilter
          # when chip buttons are deleteLater()'d during processEvents()).
          # 6.10.x is the last stable line on the headless runner.
          pip install pytest pytest-timeout qtpy 'PySide6<6.11'
          # mayatk is a TEST fixture here, not a declared dependency (several
          # tests import stable mayatk symbols); it is downstream of uitk, so
          # it is always the last PUBLISHED mayatk and has no floor to honor.
          pip install --no-cache-dir mayatk
          # WITH deps, in a retry loop. pip resolves the floors declared in
          # pyproject.toml (`pythontk>=X`), so a stale PyPI CDN edge that still
          # lists the previous release fails LOUDLY with "No matching
          # distribution" and is retried -- instead of silently installing the
          # old version and running this suite against code that lacks the new
          # symbols. Measured 2026-08-23: the bare-name install resolved
          # pythontk 0.9.28 82 s after 0.9.30 was uploaded, and the only failure
          # was two tests importing symbols that exist only in 0.9.30.
          # --no-cache-dir: pip's HTTP cache can hold the stale index page too.
          for attempt in 1 2 3 4 5 6; do
            if pip install --no-cache-dir -e "."; then break; fi
            if [ "$attempt" -lt 6 ]; then
              echo "::warning::editable install attempt $attempt failed (index propagation lag?); retrying in 30s"
              sleep 30
            else
              echo "::error::editable install failed after $attempt attempts"
              exit 1
            fi
          done

      - name: Run tests
        # mayatk installed because several tests import stable mayatk symbols
        # (bridge slots, ui handler, marking menu, preset manager). Tests must
        # NOT import a mayatk symbol renamed/added in the *current* cascade —
        # CI runs against the last *published* mayatk, which publishes AFTER
        # uitk, so such a symbol won't exist yet (its tests belong in mayatk).
        # test_marking_menu_integration.py is skipped: it drives Qt button
        # press/release sequences via QTest, and Qt's offscreen platform
        # plugin doesn't propagate release events the same way a real
        # desktop does. xvfb-run was tried but PySide6 6.11 SIGABRTs during
        # pytest collection under it (6.11; the pin above is below it). They
        # run on a real X server in the test-x11 job below; the unit-level
        # test_marking_menu.py tests still run here.
        #
        # PySide6 + pytest can SIGSEGV during *exit cleanup* (after all
        # tests have already passed) due to Qt object teardown ordering.
        # We parse the summary line and ignore non-zero pytest exit if
        # the failure count is zero.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          # Stream via tee (not $(...) capture): a hang used to show NOTHING in
          # the log because output was buffered until pytest returned. With -v,
          # the last streamed line is the test that hung. --timeout dumps that
          # test's thread stacks and force-exits rather than hanging to the 6h
          # cap; 300s is far above any real per-test cost (full suite ~17m).
          pytest --tb=short -v --timeout=300 --timeout-method=thread test/ \
            --ignore=test/test_marking_menu_integration.py 2>&1 | tee pytest_out.txt
          RC=${PIPESTATUS[0]}
          # Counts come off pytest's FINAL summary line only ("== 1 failed,
          # 2 passed, 3 errors in 4.5s =="), never the whole log: a test that
          # prints "0 failed" in its own output must not decide the gate.
          SUMMARY=$(grep -E '^=+ .* in [0-9.]+s.*=+$' pytest_out.txt | tail -1)
          FAILED=$(echo "$SUMMARY" | grep -oE '[0-9]+ failed' | head -1 | cut -d' ' -f1)
          PASSED=$(echo "$SUMMARY" | grep -oE '[0-9]+ passed' | head -1 | cut -d' ' -f1)
          # errors, NOT just failures: a collection or fixture error reports as
          # "N errors" and leaves the failed count at 0, so "100 passed,
          # 4 errors" read as green.
          ERRORS=$(echo "$SUMMARY" | grep -oE '[0-9]+ errors?' | head -1 | cut -d' ' -f1)
          FAILED=${FAILED:-0}
          PASSED=${PASSED:-0}
          ERRORS=${ERRORS:-0}
          if [ "$FAILED" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
            echo "::error::$FAILED test(s) failed, $ERRORS error(s)"
            exit 1
          fi
          # No summary line: pytest DIED mid-run (or failed collection), and the
          # last streamed test above is the site. The exit code says how: 128+N
          # is signal N (137 SIGKILL -- the OOM killer, say; 139 SIGSEGV), a
          # small code an os._exit or a SystemExit that bypassed pytest.
          if [ "$PASSED" -eq 0 ]; then
            echo "::error::pytest produced no summary (exit $RC): it died mid-run or failed collection, so this run says nothing about the change. The last streamed test above is the site."
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::warning::pytest exited with code $RC after $PASSED passing tests (PySide6+pytest cleanup SIGSEGV — known issue, not a test failure)"
          fi
          exit 0

  test-x11:
    # What the offscreen job cannot see: a real X11 window system. The marking
    # menu's press/release hand-off (test_marking_menu_integration.py -- the
    # file the offscreen job excludes) and the window-system gates (the
    # no-compositor backdrop, opaque top-levels, Wayland capability branches)
    # run on Xvfb: a bare X server with NO compositor, like a VNC/XRDP session
    # or a plain window manager. Private to the job, never a desktop.
    name: Tests (X11, no compositor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        # Qt's xcb platform plug-in links these; PySide6 wheels ship none.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libopengl0 libdbus-1-3 \
            libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install dependencies
        # The same retried floor-honoring install as the offscreen job.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout qtpy 'PySide6<6.11'
          for attempt in 1 2 3 4 5 6; do
            if pip install --no-cache-dir -e "."; then break; fi
            if [ "$attempt" -lt 6 ]; then
              echo "::warning::editable install attempt $attempt failed; retrying in 30s"
              sleep 30
            else
              echo "::error::editable install failed after $attempt attempts"
              exit 1
            fi
          done

      - name: Run tests on X11
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            pytest --tb=short -v --timeout=300 --timeout-method=thread \
            test/test_marking_menu_integration.py test/test_bootstrap.py \
            test/test_marking_menu_present_order.py test/test_header.py

  api-registry:
    # Content-hash staleness gate for the committed API_INDEX.md /
    # API_REGISTRY.md (root CLAUDE.md documents --check as the CI gate; before
    # this it was wired into no workflow). Its own job because the generator
    # lives in the m3trik repo and expects the monorepo layout - <pkg>/ and
    # m3trik/ as siblings - so the repos are checked out into sibling paths,
    # the same shape tentacle's parity job uses. pythontk is checked out for
    # one stdlib file: it owns the SymbolRecord DTO the generator loads from
    # source (SSoT for the registry's symbol shape).
    #
    # AST-only: no package install, no DCC, no git history. Deterministic in a
    # fresh checkout because --check hashes CONTENT, not mtimes, and normalizes
    # away the generation date and #L line numbers (see StalenessGate) - only a
    # real public-surface delta fails this.
    name: API registry up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: uitk

      - uses: actions/checkout@v4
        with:
          repository: m3trik/m3trik
          ref: main
          path: m3trik

      - uses: actions/checkout@v4
        with:
          repository: m3trik/pythontk
          ref: dev
          path: pythontk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Registry matches source
        run: python m3trik/scripts/generate_api_registry.py uitk --check

  lint:
    # ``ruff check`` only -- NOT ``ruff format --check``, for the reason
    # pythontk/tests.yml states: a format gate would be red on arrival and
    # therefore ignored.
    #
    # Scope is the PACKAGE dir, not ``.``. Measured 2026-09-16: the package is
    # clean against the declared rule set, while ``.`` still reports 27
    # findings, all under test/. Gating on ``.`` would make this job red on
    # arrival and therefore ignored; widen it once that is burned down.
    #
    # Pinned, because an unpinned ruff turns an upstream rule addition into a
    # red PR nobody changed.
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff==0.15.17

      - name: ruff check
        run: ruff check uitk
